# ---------------------------------------------------------------
# Configuration des tests Affariyet
# Chaque valeur peut être surchargée en ligne de commande, ex :
#   mvn test -Dbrowser=edge -Dheadless=true
# ---------------------------------------------------------------

# URL du site testé
base.url=https://www.affariyet.com/

# Navigateur : chrome | edge | firefox
browser=chrome

# true = navigateur invisible (utile pour l'intégration continue)
headless=false

# Attente explicite maximale (secondes) pour WebDriverWait
timeout.seconds=20

# Temps maximal de chargement d'une page (secondes)
page.load.timeout.seconds=60

# Dossiers de sortie
screenshots.dir=screenshots
reports.dir=reports

# Fichier de données de test
testdata.file=test-data/testdata.csv
